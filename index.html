<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strands Solution Enterprises | Luxury Wig Services</title>
    <style>
        :root {
            --berry: #be185d;
            --plum: #701a75;
            --gold: #d4af37;
            --bg: #fffcfc;
        }

        body { 
            background-color: var(--bg); 
            font-family: 'Times New Roman', serif; 
            margin: 0; 
            color: #1c1917;
            text-align: center;
        }

        /* BIG LOGO SECTION */
        .header {
            background: linear-gradient(135deg, var(--berry), var(--plum));
            color: white;
            padding: 50px 20px; /* Increased padding for more space */
            border-bottom: 5px solid var(--gold);
        }

        .logo-container {
            width: 160px; /* Increased from 110px to 160px */
            height: 160px; /* Increased from 110px to 160px */
            margin: 0 auto 20px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid var(--gold);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ensures the logo fills the circle properly */
        }

        .tagline { 
            color: var(--gold); 
            font-weight: bold; 
            font-size: 1rem; 
            letter-spacing: 3px; 
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        h1 { font-size: 2.2rem; margin: 0; letter-spacing: 1px; }

        .container {
            max-width: 550px;
            margin: -30px auto 50px;
            background: white;
            padding: 40px 30px;
            border-radius: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        .service-section { text-align: left; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: var(--plum); font-size: 0.9rem; text-transform: uppercase; }

        select, input {
            width: 100%;
            padding: 15px;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 1rem;
            background: #fafafa;
        }

        .policy-card {
            background: #fdf2f8;
            border-left: 5px solid var(--berry);
            padding: 20px;
            margin: 25px 0;
            font-size: 0.95rem;
            border-radius: 0 15px 15px 0;
        }

        .order-btn {
            background: var(--berry);
            color: white;
            border: none;
            width: 100%;
            padding: 20px;
            border-radius: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(190, 24, 93, 0.2);
        }
    </style>
</head>
<body>

<div class="header">
    <div class="logo-container">
        <img src="my_logo.png" alt="Strand Solution Logo" onerror="this.src='https://via.placeholder.com/160?text=LOGO+HERE'">
    </div>
    <div class="tagline">Luxury Artistry</div>
    <h1>Strand Solution</h1>
</div>

<div class="container">
    <div class="service-section">
        <label>Your Name</label>
        <input type="text" id="custName" placeholder="Enter Full Name">

        <label>Select Service</label>
        <select id="serviceSelected">
            <optgroup label="Ventilation Artistry">
                <option value="2x4 Ventilation|9000">2x4 Ventilation - ₦9,000</option>
                <option value="4x4 Ventilation|20000">4x4 Ventilation - ₦20,000</option>
                <option value="13x4 Ventilation|55000">13x4 Ventilation - ₦55,000</option>
                <option value="13x6 Ventilation|60000">13x6 Ventilation - ₦60,000</option>
            </optgroup>
            <optgroup label="Wig Construction">
                <option value="Hand Wigging|10000">Hand Wigging - ₦10,000</option>
                <option value="Machine Wigging|20000">Machine Wigging - ₦20,000</option>
            </optgroup>
            <optgroup label="Revamp Services">
                <option value="Curly Revamp|16000">Curly Revamp - from ₦16,000</option>
                <option value="Straight Revamp|14000">Straight Revamp - from ₦14,000</option>
                <option value="Bouncy Revamp|15000">Bouncy Revamp - from ₦15,000</option>
            </optgroup>
        </select>

        <label>Timeline</label>
        <select id="orderType">
            <option value="Standard (2 Weeks)|0">Standard - 2 Weeks</option>
            <option value="Rush Order|5000">Rush Order - +₦5,000</option>
        </select>

        <div class="policy-card">
            <strong>Business Policy:</strong>
            <ul>
                <li>70% non-refundable deposit required.</li>
                <li>Fixed pricing; No negotiations.</li>
                <li>Production timeline: 2 weeks.</li>
            </ul>
        </div>

        <button class="order-btn" onclick="sendOrder()">Book Appointment</button>
    </div>
</div>

<script>
    function sendOrder() {
        const phone = "2348000000000"; // REPLACE WITH YOUR NUMBER
        const name = document.getElementById('custName').value;
        const service = document.getElementById('serviceSelected').value.split('|');
        const rush = document.getElementById('orderType').value.split('|');

        if(!name) return alert("Please enter your name");

        const total = parseInt(service[1]) + parseInt(rush[1]);
        const deposit = total * 0.7;

        const text = `*NEW ORDER: STRAND SOLUTION*%0A` +
                     `Name: ${name}%0A` +
                     `Service: ${service[0]}%0A` +
                     `Priority: ${rush[0]}%0A` +
                     `Total: ₦${total.toLocaleString()}%0A` +
                     `70% Deposit Required: ₦${deposit.toLocaleString()}`;

        window.open(`https://wa.me/${phone}?text=${text}`);
    }
</script>

</body>
</html>
